name: CI

# Build-and-test only. No deploy, no publish, no release, no container push.
on:
  push:
  pull_request:

# Read the code, nothing more: no job here writes to the repository.
permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (MySQL 8)
    runs-on: ubuntu-latest

    services:
      # MySQL, deliberately — not SQLite. The suite's inventory and order tests
      # rely on real `SELECT ... FOR UPDATE` row locking, which SQLite accepts
      # and silently ignores; running them there would report green while
      # testing nothing. 8.0 matches the development server (8.0.46).
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: minishop
          MYSQL_DATABASE: minishop
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

    env:
      # config/settings/base.py refuses to start without this and rejects any
      # non-MySQL scheme. backend/.env is gitignored, so CI supplies it here.
      DATABASE_URL: mysql://root:minishop@127.0.0.1:3306/minishop

    steps:
      - uses: actions/checkout@v4

      - name: No runtime uploads or logs are tracked
        # backend/media/ holds runtime uploads, customers' photos among them,
        # and logs hold request data. Both are gitignored (BUG-043); this
        # catches a file added with `git add -f` or before the ignore rule.
        run: |
          tracked=$(git ls-files backend/media '*.log')
          if [ -n "$tracked" ]; then
            echo "These runtime files are tracked; git rm --cached them:"
            echo "$tracked"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install MySQL client and build headers
        # mysql-client provides `mysqldump` and `mysql`, which Django shells out
        # to when --parallel clones the test database once per worker.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mysql-client libmysqlclient-dev pkg-config

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Confirm tblib is available
        # Django returns test failures from parallel workers to the parent by
        # pickling them, and tracebacks are not picklable without tblib. Without
        # it a --parallel run does not merely lose a traceback: it aborts with
        # "TypeError: cannot pickle 'traceback' object" the moment any test
        # fails, reporting nothing. It ships in requirements.txt; this step
        # fails loudly if that ever stops being true.
        run: python -c "import tblib; print('tblib', tblib.__version__)"

      - name: Wait for MySQL to accept connections
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -pminishop --silent; then
              echo "MySQL is accepting connections"
              exit 0
            fi
            echo "waiting for MySQL ($i/30)"
            sleep 2
          done
          echo "MySQL did not become ready in time"
          exit 1

      - name: Generate throwaway secret keys
        # config.settings.dev refuses to start without both keys, and there is
        # no backend/.env in a fresh checkout. Made up per run: nothing CI signs
        # outlives the job. (config.settings.test would make its own.)
        run: |
          echo "DJANGO_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(50))')" >> "$GITHUB_ENV"
          echo "DJANGO_JWT_SIGNING_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(50))')" >> "$GITHUB_ENV"

      - name: Django system checks
        working-directory: backend
        run: |
          python manage.py check
          python manage.py check --settings=config.settings.test
          python manage.py makemigrations --check --dry-run

      - name: Production deploy check
        # config.settings.prod with the throwaway keys above and made-up
        # hosts: any deploy warning (DEBUG, HSTS, cookies, weak keys...) fails
        # the build instead of waiting for someone to run it by hand.
        working-directory: backend
        env:
          DJANGO_ALLOWED_HOSTS: shop.example.com
          DJANGO_CORS_ALLOWED_ORIGINS: https://shop.example.com
        run: python manage.py check --deploy --fail-level WARNING --settings=config.settings.prod

      - name: Backend test suite
        working-directory: backend
        # --parallel 4, not a bare --parallel: config.settings.test defaults to
        # 4x the core count, which suits the high-latency remote database used
        # in development. Against this job's local MySQL the suite is CPU-bound
        # instead, so one worker per core is the right number.
        # No --keepdb: the service container starts empty on every run.
        run: python manage.py test --settings=config.settings.test --parallel 4 --noinput

  frontend:
    name: Frontend typecheck, tests and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        # The errors that predate this check (set-state-in-effect and
        # no-explicit-any) are recorded in eslint-suppressions.json, so only
        # new ones fail. Fixing a recorded one fails too, until the record is
        # trimmed with `npx eslint . --prune-suppressions`: the baseline only
        # shrinks.
        working-directory: frontend
        run: npm run lint

      - name: Unit and component tests
        # Vitest with jsdom and Testing Library (vitest.config.mts). No backend
        # is needed: the tests stub fetch and the API modules.
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: No secrets in the committed files
        # gitleaks' default rules (.gitleaks.toml allows only the backend
        # tests' made-up Word-Word-123 passwords). It scans the files as they
        # stand; history from before this check is not rewritten.
        run: >-
          docker run --rm -v "$PWD:/repo:ro" -w /repo ghcr.io/gitleaks/gitleaks:v8.28.0
          dir . --config .gitleaks.toml --redact --no-banner

  dependency-audit:
    name: Dependency audit (report only)
    runs-on: ubuntu-latest
    # Known advisories in current dependencies (Next.js among them) are
    # tracked as follow-up work; until they are cleared this job reports them
    # without failing the build.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --package-lock-only --audit-level=high

      # The backend is audited even when the frontend audit finds something.
      - uses: actions/setup-python@v5
        if: ${{ !cancelled() }}
        with:
          python-version: '3.12'

      - name: pip-audit (backend)
        if: ${{ !cancelled() }}
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt
