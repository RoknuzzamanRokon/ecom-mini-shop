<div class="bg-surface rounded-lg border border-line p-4 shadow-sm">
  <div class="flex items-center justify-between border-b border-line-subtle pb-2.5 mb-3">
    <h3 class="font-bold text-xs uppercase tracking-wider text-ink">HOT DEALS</h3>
  </div>
  <a class="relative bg-surface-alt rounded-lg overflow-hidden mb-3 aspect-[4/3] flex items-center justify-center" href="{% url 'shop:product_detail' hot_deal.slug %}">
    {% if hot_deal.image %}
    <img alt="{{ hot_deal.name }}" class="w-full h-full object-cover" src="{{ hot_deal.image.url }}"/>
    {% else %}
    <span class="material-symbols-outlined text-[48px] text-ink-faint">image</span>
    {% endif %}
    {% if hot_deal.discount_percent %}
    <span class="absolute top-2 right-2 w-9 h-9 rounded-full bg-danger text-on-primary font-bold text-[11px] leading-tight flex flex-col items-center justify-center shadow-md">
      <span>{{ hot_deal.discount_percent }}%</span>
      <span class="text-[9px] font-medium leading-none">OFF</span>
    </span>
    {% endif %}
  </a>
  <div class="text-center">
    <a class="font-semibold text-sm text-ink hover:text-primary line-clamp-1" href="{% url 'shop:product_detail' hot_deal.slug %}">{{ hot_deal.name }}</a>
    <div class="flex items-center justify-center gap-2 my-2">
      <span class="text-base font-bold text-price">${{ hot_deal.price }}</span>
      {% if hot_deal.old_price %}
      <span class="text-xs text-price-old line-through">${{ hot_deal.old_price }}</span>
      {% endif %}
    </div>
  </div>
</div>
