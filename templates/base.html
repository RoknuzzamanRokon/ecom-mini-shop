{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>{% block title %}MiniShop{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="{% static 'css/style.css' %}" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#f8f9ff",
            "on-surface": "#0b1c30",
            "on-surface-variant": "#434655",
            "primary": "#004ac6",
            "primary-container": "#2563eb",
            "on-primary": "#ffffff",
            "secondary": "#565e74",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#eff4ff",
            "surface-container": "#e5eeff",
            "outline-variant": "#e2e8f0",
            "outline": "#737686",
            "brand-yellow": "#FBBF24",
            "brand-yellow-hover": "#F59E0B"
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          fontFamily: {
            sans: ["Inter", "sans-serif"]
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#f4f6fb] font-sans text-on-surface antialiased">
{% include "shop/partials/navbar.html" %}

{% if messages %}
<div class="max-w-[1360px] mx-auto px-4 sm:px-6 pt-4">
  {% for message in messages %}
  <div class="rounded-md px-4 py-2.5 text-sm font-medium mb-2 {% if message.tags == 'success' %}bg-emerald-50 text-emerald-700 border border-emerald-200{% elif message.tags == 'error' %}bg-rose-50 text-rose-700 border border-rose-200{% else %}bg-blue-50 text-primary-container border border-blue-100{% endif %}">
    {{ message }}
  </div>
  {% endfor %}
</div>
{% endif %}

{% block content %}{% endblock %}

{% include "shop/partials/footer.html" %}
<script src="{% static 'js/cart.js' %}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
